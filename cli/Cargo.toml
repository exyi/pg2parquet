[package]
description = "Command line tool for exporting PostgreSQL tables or queries into Parquet files"
license = "Apache-2.0"
repository = "https://github.com/exyi/pg2parquet"
readme = "../README.md"
keywords = ["cli", "postgres", "parquet"]
documentation = "https://github.com/exyi/pg2parquet"
name = "pg2parquet"
version = "0.2.1"
edition = "2021"

[features]
default = []
manpage_gen = [ "dep:clap_mangen", "dep:clap_complete_nushell", "dep:clap_complete" ]

[dependencies]
parquet = { version = "59.3.0", default-features = false, features = ["zstd", "lz4", "flate2", "flate2-rust_backened", "brotli", "snap", "base64", "arrow"] }
arrow = "59.3.0"
serde_json = "1.0.128"
postgres = { version = "0.19.10", features = ["with-chrono-0_4", "with-serde_json-1", "with-bit-vec-0_6", "with-uuid-1", "with-geo-types-0_7", "with-eui48-1"] }
pgvector = { version = "0.4", features = ["postgres", "halfvec"] }
half = { version = "2.4.1" }
uuid = "1.18.0"
chrono = "0.4.41"
clap = { version = "4.5.45", features = ["derive"] }
eui48 = "1.1.0"
bit-vec = "0.6.3"
pg_bigdecimal = "0.1.5"
bigdecimal = "0.4.7"
bytes = "1.11.1"
postgres-protocol = "0.6.7"
byteorder = "1.5.0"
rpassword = "7.5.3"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "sync", "macros"] }
crossbeam-channel = "0.5"

# optional:
clap_mangen = { version = "0.3.3", optional = true }
clap_complete = { version = "4.5.58", optional = true }
clap_complete_nushell = { version = "4.5.8", optional = true }

[target.'cfg(not(any(target_family = "windows", target_arch = "riscv64")))'.dependencies]
jemallocator = "0.5.4"

[target.'cfg(any(target_os = "macos", target_os="windows", all(target_os="linux", not(target_env="musl"), any(target_arch="x86_64", target_arch="aarch64"))))'.dependencies]
postgres-native-tls = "0.5.0"
native-tls = "0.2.11"

[profile.release]
# codegen-units = 1
# strip = true
# lto = true
# opt-level = "z"

[profile.ci-build]
inherits = "release"
codegen-units = 1
lto = true
# strip = true
